spring.application.name=RealTimeAlertingService

spring.datasource.username = ${DB_USERNAME}
spring.datasource.url = jdbc:postgresql://localhost:5432/realtime_alerting_service
spring.datasource.password = ${DB_PASSWORD}

spring.datasource.driver-class-name = org.postgresql.Driver
spring.jpa.show-sql = true
spring.liquibase.change-log = classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled = true
spring.jpa.hibernate.ddl-auto= update

spring.jpa.properties.hibernate.default_batch_fetch_size = 32

logging.level.root=INFO
logging.level.com.example.project=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topics.events=external.events
app.kafka.consumer.group-id=alerting-service

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

telegram.bot.token= ${BOT_TOKEN}
telegram.bot.username= alertingServiceBot

jwt.signing.key = ${JWT_SIGNING_KEY}
